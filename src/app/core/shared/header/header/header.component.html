<nav>
  <div class="nav-wrapper">
    <span class="header-name-language">
      <span class="header-name">MM</span>
    </span>
    <div class="nav-actions">
      @if (isDetailView) {
      <button class="back-button" (click)="closeModal(); $event.stopPropagation()">
        <mat-icon>arrow_back</mat-icon>
        <span>Zurück</span>
      </button>
      }
    </div>
    <div class="language-switch">
      <button (click)="changeLanguage('de')" [class.active]="currentLanguage === 'de'" class="lang-btn">
        DE
      </button>
      <button (click)="changeLanguage('en')" [class.active]="currentLanguage === 'en'" class="lang-btn">
        EN
      </button>
    </div>
    <div class="right-section">
      <button 
        class="mode-switch-header"
        [class.admin-mode]="(mode$ | async) === 'admin'"
        (click)="toggleMode()"
        title="Toggle between Coder and Admin mode">
        <svg class="mode-svg-header" viewBox="0 0 44 44" width="44" height="44">
          <!-- Plug (left side) -->
          <circle [attr.cx]="getPlugX()" [attr.cy]="22" [attr.r]="3" 
                  [attr.fill]="(mode$ | async) === 'admin' ? '#4caf50' : '#64b5f6'"/>
          
          <!-- Server box (right side) -->
          <rect [attr.x]="26" [attr.y]="16" width="10" height="12" fill="none"
                [attr.stroke]="(mode$ | async) === 'admin' ? '#4caf50' : '#64b5f6'"
                stroke-width="1"/>
          
          <!-- Power indicators (admin mode only) -->
          @if ((mode$ | async) === 'admin') {
            <circle cx="29" cy="18" r="1.5" fill="#4caf50"/>
            <circle cx="32" cy="18" r="1.5" fill="#4caf50"/>
          }
          
          <!-- Cable -->
          <path [attr.d]="getCablePath()" fill="none"
                [attr.stroke]="(mode$ | async) === 'admin' ? '#4caf50' : '#64b5f6'"
                stroke-width="1"/>
        </svg>
      </button>
      <button mat-icon-button (click)="toggleTheme()" class="theme-toggle-btn">
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
    <div id="responsive-menu-button" class="d-none" (click)="openResponsiveMenu()">
      <img src="../../assets/img/responsive_menu.png" alt="" />
    </div>
    <div id="responsive-menu">
      <div id="close-responsive" (click)="closeResponsiveMenu()">X</div>
      <a href="#about-me-anchor">{{ "responsmenu.aboutme" | translate }}</a>
      <a href="#my-skill-anchor">{{ "responsmenu.skill" | translate }}</a>
      <a href="#portfolio-anchor">{{ "responsmenu.portfolio" | translate }}</a>
      <a href="#contact-anchor">{{ "responsmenu.contact" | translate }}</a>
      <a href="imprint">{{ "responsmenu.imprint" | translate }}</a>
      <a href="privacy-policy">{{ "policy.policy" | translate }}</a>
    </div>
  </div>
</nav>
