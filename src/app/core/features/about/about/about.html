@if (isModal) {
<section class="about-wrapper" [class.is-modal]="isModal">
  <header class="about-header">
    <div class="header-main">
      <span class="blue-tag">
        {{ "aboutme.aboutme" | translate }}
      </span>
      <h2>Mein Weg als Entwickler</h2>
    </div>
  </header>

  <div class="content-grid">
    <div class="main-story">
      <p class="story-text">
        {{ "aboutme.story" | translate }}
      </p>
    </div>

    <div class="highlight-sidebar">
      <div class="info-card personal">
        <div class="icon-box">
          <img src="img/light-bulb-about-me.png" alt="Ideen" />
        </div>
        <div class="text-box">
          <h4>Motivation</h4>
          <p>{{ "aboutme.newtask" | translate }}</p>
        </div>
      </div>

      <div class="info-card job">
        <div class="icon-box">
          <img src="img/puzzle-about-me.png" alt="Lösung" />
        </div>
        <div class="text-box">
          <h4>Arbeitsweise</h4>
          <p>{{ "aboutme.job" | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
} @else {
<header class="preview-header">
  <span><mat-icon>psychology</mat-icon></span>
  <h2>{{'aboutme.aboutme' | translate}}</h2>
</header> }
