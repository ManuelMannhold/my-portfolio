@if (expandedTile) {
<div class="modal-overlay" (click)="expandedTile = null"></div>
}

<app-header [isDetailView]="isDetailView" (backToGrid)="closeModalFromHeader()">
</app-header>

<app-landing-page></app-landing-page>

<main class="bento-container">

  <section class="tile contact-tile">
    <app-contact (openAsModal)="openDetail(Contact)" (mouseenter)="updateCursorHover(true, 'Contact')"
      (mouseleave)="updateCursorHover(false)">
    </app-contact>
  </section>

  <div class="middle-section">
    <section class="tile about-tile" (click)="openDetail(About)" (mouseover)="updateCursorHover(true, 'Mehr')"
      (mouseleave)="updateCursorHover(false)">
      <app-about></app-about>
    </section>

    <section class="tile stack-tile" (click)="openDetail(TechStack)"
      (mouseenter)="updateCursorHover(true, 'Tech Stack')" (mouseleave)="updateCursorHover(false)">
      <app-tech-stack></app-tech-stack>
    </section>

    <section class="tile stack-tile">
      <app-legal (openAsModal)="openDetail(Legal)" (mouseenter)="updateCursorHover(true, 'Legal Notice')"
        (mouseleave)="updateCursorHover(false)">
      </app-legal>
    </section>

  </div>

  <section class="tile projects-tile" (click)="openDetail(Projects)" (mouseenter)="updateCursorHover(true, 'Projects')"
    (mouseleave)="updateCursorHover(false)">
    <app-projects></app-projects>
  </section>

  <app-custom-cursor #appCursor></app-custom-cursor>

</main>
