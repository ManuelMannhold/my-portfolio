<app-custom-cursor #cursor></app-custom-cursor>

@if (expandedTile) {
<div class="modal-overlay" (click)="expandedTile = null"></div>
}

<app-header [isDetailView]="!!expandedTile" (backToGrid)="expandedTile = null"></app-header> @if (expandedTile) {
<div class="modal-overlay" (click)="expandedTile = null"></div>
}

<app-landing-page></app-landing-page>

<main class="bento-container">

  <section class="tile stack-tile">
    <app-about (openAsModal)="openDetail(About)" (mouseenter)="cursor.setHoverState(true, 'About Me')"
      (mouseleave)="cursor.setHoverState(false)">>
    </app-about>
  </section>

  <section class="tile stack-tile">
    <app-tech-stack (openAsModal)="openDetail(TechStack)" (mouseenter)="cursor.setHoverState(true, 'Skills')"
      (mouseleave)="cursor.setHoverState(false)">>
    </app-tech-stack>
  </section>

  <section class="tile stack-tile">
    <app-projects (openAsModal)="openDetail(Projects)" (mouseenter)="cursor.setHoverState(true, 'Projects')"
      (mouseleave)="cursor.setHoverState(false)">>
    </app-projects>
  </section>

  <section class="tile stack-tile">
    <app-contact (openAsModal)="openDetail(Contact)" (mouseenter)="cursor.setHoverState(true, 'Contact')"
      (mouseleave)="cursor.setHoverState(false)">>
    </app-contact>
  </section>


  <section class="tile stack-tile">
    <app-legal (openAsModal)="openDetail(Legal)" (mouseenter)="cursor.setHoverState(true, 'Legal Notice')"
      (mouseleave)="cursor.setHoverState(false)">>
    </app-legal>
  </section>

</main>
